<?xml version="1.0" encoding="utf-8"?>
<!-- VELOCITY GP — speed-mark logo: an italic V carved from racing lines -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="vgpRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2d20"/>
      <stop offset="0.55" stop-color="#e10600"/>
      <stop offset="1" stop-color="#8f0400"/>
    </linearGradient>
  </defs>
  <!-- the V: two slashing strokes meeting at a point -->
  <path d="M14 10 L28 10 L38 40 L48 10 L62 10 L44 56 L32 56 Z" fill="url(#vgpRed)"/>
  <!-- speed streaks trailing the mark -->
  <path d="M0 16 L10 16 L13 24 L3 24 Z" fill="#e10600" opacity="0.85"/>
  <path d="M0 32 L7 32 L10 40 L1 40 Z" fill="#e10600" opacity="0.65"/>
  <path d="M0 48 L5 48 L8 56 L0 56 Z" fill="#e10600" opacity="0.45"/>
</svg>
